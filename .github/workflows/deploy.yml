name: Deploy

on:
  push:
    branches: [main]
    # Only trigger deployment when relevant files actually change.
    # A README edit shouldn't redeploy the backend.
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - ".env.example"

  # Allow manual deploys from the Actions tab
  workflow_dispatch:
    inputs:
      target:
        description: "What to deploy"
        required: true
        default: "both"
        type: choice
        options: [both, backend, frontend]

# Only one deployment runs at a time — no parallel deploys to prod
concurrency:
  group: deploy-production
  cancel-in-progress: false   # never cancel a running deploy — let it finish

jobs:

  # ─────────────────────────────────────────────────────────────────────────
  # Guard — CI must have passed before we deploy anything
  # ─────────────────────────────────────────────────────────────────────────
  ci-gate:
    name: Wait for CI
    runs-on: ubuntu-latest
    steps:
      - name: Verify CI workflow passed
        uses: actions/github-script@v7
        with:
          script: |
            const { data: checks } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              ref:   context.sha,
            });
            const ciRuns = checks.check_runs.filter(r => r.name.startsWith('CI /') || r.name === 'CI');
            const failed = ciRuns.filter(r => r.conclusion === 'failure' || r.conclusion === 'cancelled');
            if (failed.length > 0) {
              core.setFailed(`CI checks failed: ${failed.map(r => r.name).join(', ')}`);
            }

  # ─────────────────────────────────────────────────────────────────────────
  # Detect what actually changed so we skip unnecessary deploys
  # ─────────────────────────────────────────────────────────────────────────
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend:  ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'docker-compose*.yml'
              - '.github/workflows/deploy.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/deploy.yml'

  # ─────────────────────────────────────────────────────────────────────────
  # Build & push Docker image to GitHub Container Registry (GHCR)
  # Render will pull from here — gives you a versioned, auditable image history
  # ─────────────────────────────────────────────────────────────────────────
  build-backend-image:
    name: Build & push backend image
    runs-on: ubuntu-latest
    needs: [ci-gate, changes]
    # Run if backend changed OR if manually triggered for backend/both
    if: |
      needs.changes.outputs.backend == 'true' ||
      (github.event_name == 'workflow_dispatch' && contains(fromJSON('["both","backend"]'), inputs.target))

    permissions:
      contents: read
      packages: write    # needed to push to GHCR

    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # auto-provided, no setup needed

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            # Always tag latest on main
            type=raw,value=latest,enable={{is_default_branch}}
            # Immutable tag: sha-abc1234
            type=sha,prefix=sha-,format=short
            # Semantic version tags if you use git tags (v1.2.3)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file:    ./backend/Dockerfile
          push: true
          tags:   ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          target: runtime
          # Layer caching via GHA cache — makes rebuilds very fast
          cache-from: type=gha,scope=backend-prod
          cache-to:   type=gha,scope=backend-prod,mode=max
          build-args: |
            BUILD_SHA=${{ github.sha }}

  # ─────────────────────────────────────────────────────────────────────────
  # Deploy backend to Render
  #
  # How this works:
  #   Render supports "deploy hooks" — a secret URL you hit with a POST
  #   and Render triggers a pull + deploy of your service.
  #   Get it from: Render Dashboard → your service → Settings → Deploy Hook
  #
  # Required secret: RENDER_DEPLOY_HOOK_URL
  # ─────────────────────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy backend → Render
    runs-on: ubuntu-latest
    needs: [build-backend-image]
    environment:
      name: production
      url: ${{ vars.BACKEND_URL }}

    steps:
      - name: Trigger Render deploy hook
        run: |
          echo "→ Triggering Render deploy..."
          RESPONSE=$(curl --silent --show-error \
            --max-time 30 \
            --retry 3 \
            --retry-delay 5 \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")

          echo "Render response: $RESPONSE"

          # Render returns {"id":"...","status":"created"} on success
          if echo "$RESPONSE" | grep -q '"id"'; then
            echo "✓ Deploy triggered successfully"
          else
            echo "✗ Unexpected response from Render"
            exit 1
          fi

      - name: Wait for backend to be healthy
        run: |
          echo "→ Waiting for backend health check..."
          MAX=20
          for i in $(seq 1 $MAX); do
            STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
              --max-time 10 \
              "${{ vars.BACKEND_URL }}/api/trip/health/" || echo "000")

            if [ "$STATUS" = "200" ]; then
              echo "✓ Backend healthy after $i attempts"
              exit 0
            fi

            echo "  attempt $i/$MAX — got $STATUS, retrying in 15s..."
            sleep 15
          done

          echo "✗ Backend did not become healthy after $((MAX * 15))s"
          exit 1

      - name: Smoke test — trip plan endpoint
        run: |
          echo "→ Running smoke test..."
          RESPONSE=$(curl --silent --show-error \
            --max-time 30 \
            -X POST "${{ vars.BACKEND_URL }}/api/trip/plan/" \
            -H "Content-Type: application/json" \
            -d '{
              "current_location": "Chicago, IL",
              "pickup_location":  "Indianapolis, IN",
              "dropoff_location": "Columbus, OH",
              "current_cycle_hours": 10
            }')

          # Verify response contains expected keys
          if echo "$RESPONSE" | grep -q '"daily_logs"' && \
             echo "$RESPONSE" | grep -q '"trip_summary"'; then
            echo "✓ Smoke test passed"
          else
            echo "✗ Smoke test failed — unexpected response:"
            echo "$RESPONSE" | head -c 500
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────────────
  # Deploy frontend to Vercel
  #
  # Required secrets:
  #   VERCEL_TOKEN      — from vercel.com/account/tokens
  #   VERCEL_ORG_ID     — from .vercel/project.json after `vercel link`
  #   VERCEL_PROJECT_ID — from .vercel/project.json after `vercel link`
  # ─────────────────────────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy frontend → Vercel
    runs-on: ubuntu-latest
    needs: [ci-gate, changes, deploy-backend]
    if: |
      always() &&
      (needs.changes.outputs.frontend == 'true' ||
       github.event_name == 'workflow_dispatch' && contains(fromJSON('["both","frontend"]'), inputs.target)) &&
      (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped')

    environment:
      name: production
      url: ${{ vars.FRONTEND_URL }}

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for production
        run: |
          vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          REACT_APP_API_URL: ${{ vars.BACKEND_URL }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          DEPLOY_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "✓ Deployed to: $DEPLOY_URL"

      - name: Smoke test — frontend loads
        run: |
          STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            --max-time 15 "${{ steps.deploy.outputs.url }}")
          if [ "$STATUS" = "200" ]; then
            echo "✓ Frontend returned 200"
          else
            echo "✗ Frontend returned $STATUS"
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────────────
  # Summary — posts a comment on the commit with deploy results
  # ─────────────────────────────────────────────────────────────────────────
  summary:
    name: Deployment summary
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    if: always()

    permissions:
      contents: read
      statuses: write

    steps:
      - name: Set commit status
        uses: actions/github-script@v7
        with:
          script: |
            const backendResult  = '${{ needs.deploy-backend.result }}';
            const frontendResult = '${{ needs.deploy-frontend.result }}';

            const allOk = ['success', 'skipped'].includes(backendResult) &&
                          ['success', 'skipped'].includes(frontendResult);

            await github.rest.repos.createCommitStatus({
              owner:       context.repo.owner,
              repo:        context.repo.repo,
              sha:         context.sha,
              state:       allOk ? 'success' : 'failure',
              description: allOk
                ? `Deployed — backend: ${backendResult}, frontend: ${frontendResult}`
                : `Deploy failed — backend: ${backendResult}, frontend: ${frontendResult}`,
              context:     'deploy / production',
              target_url:  `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
