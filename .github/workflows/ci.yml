name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs on the same branch when a new push arrives.
# Saves CI minutes and avoids queueing stale runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ─────────────────────────────────────────────────────────────────────────
  # Backend — lint + tests
  # ─────────────────────────────────────────────────────────────────────────
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB:       test_eld
          POSTGRES_USER:     test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_eld"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      DJANGO_SETTINGS_MODULE: trip_planner.settings
      DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_eld
      SECRET_KEY: ci-secret-key-not-used-in-production
      DEBUG: "True"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint — ruff
        run: ruff check .

      - name: Lint — ruff format check
        run: ruff format --check .

      - name: Django system checks
        run: python manage.py check --deploy 2>&1 | grep -v "^System check" || true
        env:
          DEBUG: "False"
          ALLOWED_HOSTS: localhost

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run tests
        run: |
          python manage.py test --verbosity=2 --keepdb

      - name: HOS calculator unit tests
        run: python -m pytest trips/tests/ -v --tb=short

  frontend:
    name: Frontend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ["20"]

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint — ESLint
        run: npm run lint --if-present

      - name: Type check
        run: npm run typecheck --if-present

      - name: Build
        run: npm run build
        env:
          # Dummy API URL — just needs to be set for the build to pass
          REACT_APP_API_URL: https://placeholder.example.com
          # Treat warnings as errors in CI
          CI: true

      - name: Check build output exists
        run: test -d build && test -f build/index.html

  docker:
    name: Docker build check
    runs-on: ubuntu-latest
    needs: [backend]   # no point building Docker if tests fail

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: eld-backend:ci
          # Cache layers between runs using GitHub's cache backend
          cache-from: type=gha,scope=backend
          cache-to:   type=gha,scope=backend,mode=max
          # Build both stages to catch builder errors too
          target: runtime
