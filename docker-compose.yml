version: "3.9"


services:

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       eld_planner
      POSTGRES_USER:     eld_user
      POSTGRES_PASSWORD: eld_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"   
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eld_user -d eld_planner"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime   
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY:          "dev-secret-key-change-in-production-please"
      DEBUG:               "True"
      ALLOWED_HOSTS:       "localhost,127.0.0.1,backend"
      DJANGO_SETTINGS_MODULE: trip_planner.settings

      
      DATABASE_URL:        "postgres://eld_user:eld_password@db:5432/eld_planner"
      DB_CONN_MAX_AGE:     "60"

      CORS_ALLOWED_ORIGINS: "http://localhost:3000"

      
      GUNICORN_WORKERS:    "2"
      GUNICORN_LOG_LEVEL:  "info"
      PORT:                "8000"
    depends_on:
      db:
        condition: service_healthy   # won't start until Postgres passes healthcheck
    volumes:
      # Mount source for live reload in dev — remove in prod
      - ./backend:/app
      # Keep the sqlite file out of the mount (not used with Postgres, but safe)
      - /app/db.sqlite3
      # Keep compiled static outside the source mount
      - static_volume:/app/staticfiles
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/trip/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
  static_volume:
